<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="font-bold text-lg">Life Admin</ion-title>
    <ion-buttons slot="end">
      <ion-button color="primary">
        <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Good morning,</h1>
    <p class="text-gray-500">Your agent has 2 updates for you.</p>
  </div>

  <!-- Status Cards -->
  <div class="grid grid-cols-2 gap-4 mb-8">
    <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-emerald-500">
      <p class="text-xs text-gray-500 uppercase tracking-wider">Active Tasks</p>
      <p class="text-2xl font-bold">12</p>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-navy-900" style="border-color: #001F3F">
      <p class="text-xs text-gray-500 uppercase tracking-wider">Saved Time</p>
      <p class="text-2xl font-bold text-emerald-600">4.5h</p>
    </div>
  </div>

  <!-- Actionable List -->
  <h2 class="text-sm font-semibold text-gray-400 uppercase mb-3">Pending Bureaucracy</h2>
  <ion-list lines="none" class="bg-transparent">
    <ion-item class="mb-2 rounded-lg shadow-sm border border-gray-100">
      <ion-icon slot="start" name="document-text-outline" color="primary"></ion-icon>
      <ion-label>
        <h3 class="font-semibold">Passport Renewal</h3>
        <p>Agent is waiting for signature</p>
      </ion-label>
      <ion-badge slot="end" color="success">Action Needed</ion-badge>
    </ion-item>

    <ion-item class="mb-2 rounded-lg shadow-sm border border-gray-100">
      <ion-icon slot="start" name="business-outline" color="primary"></ion-icon>
      <ion-label>
        <h3 class="font-semibold">Tax Assessment 2023</h3>
        <p>Filing in progress...</p>
      </ion-label>
      <ion-spinner slot="end" name="dots" color="primary"></ion-spinner>
    </ion-item>
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="success">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  <ion-button (click)="testTokens()">Test Tokens</ion-button>
</ion-content>
